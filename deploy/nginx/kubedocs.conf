# Copy to /opt/ghost/nginx/conf/kubedocs.conf, then: docker compose -f /opt/ghost/docker-compose.yml exec nginx nginx -t && ... nginx -s reload
# Also add `kubedocs.nizmitz.com` to the port-80 redirect server_name list in default.conf.
limit_req_zone $binary_remote_addr zone=kubedocs:2m rate=10r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name kubedocs.nizmitz.com;
    ssl_certificate /etc/letsencrypt/live/kubedocs.nizmitz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubedocs.nizmitz.com/privkey.pem;

    client_max_body_size 1m;
    limit_req zone=kubedocs burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        set $upstream_kd kube-docs-mcp;
        proxy_pass http://$upstream_kd:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
