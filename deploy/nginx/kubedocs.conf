# Copy to /opt/ghost/nginx/conf/kubedocs.conf, then: docker compose -f /opt/ghost/docker-compose.yml exec nginx nginx -t && ... nginx -s reload
# Also add `kubedocs.nizmitz.com` to the port-80 redirect server_name list in default.conf.
limit_req_zone $binary_remote_addr zone=kubedocs:2m rate=10r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name kubedocs.nizmitz.com;
    ssl_certificate /etc/letsencrypt/live/kubedocs.nizmitz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubedocs.nizmitz.com/privkey.pem;

    client_max_body_size 1m;
    limit_req zone=kubedocs burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # $upstream_kd is a hardcoded literal (the compose service name), not derived from any
        # client-controlled input -- there is nothing here for an attacker to redirect.
        set $upstream_kd kube-docs-mcp;
        proxy_pass http://$upstream_kd:8080; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
        proxy_http_version 1.1;
        # Forwarding the original Host header downstream is standard reverse-proxy practice; it
        # is not used to choose the proxy destination (see $upstream_kd above), and this server
        # block is already restricted to server_name kubedocs.nizmitz.com.
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
