name: build-server
on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", ".github/workflows/build-server.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-docs-mcp
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No dependency cache here: this workflow publishes a release artifact from a
      # push/tag trigger, and a poisoned cache would ship straight to users (zizmor: cache-poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm ci && npm run build
        working-directory: web
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: server/Dockerfile }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", severity: "HIGH,CRITICAL", exit-code: "1", format: sarif, output: trivy-image.sarif }
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with: { sarif_file: trivy-image.sarif }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with: { image: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", format: spdx-json, artifact-name: sbom.spdx.json }
