slug: external-secrets
name: External Secrets Operator
category: cncf
homepage: https://external-secrets.io
license: { code: Apache-2.0, docs: Apache-2.0 }
attribution: "External Secrets Operator documentation and CRDs © The External Secrets Authors, Apache 2.0."
source:
  repo: external-secrets/external-secrets
  versions:
    strategy: latest-minors
    count: 2
    tag_pattern: '^v(\d+)\.(\d+)\.(\d+)$'
schemas:
  - type: crd-yaml
    paths: ['config/crds/bases/*.yaml']
docs:
  - format: mkdocs-md
    root: docs
    include:
      - 'api/**/*.md'
      - 'provider/**/*.md'
      - 'guides/**/*.md'
    url:
      base: 'https://external-secrets.io/v{major}.{minor}/'
      strip_ext: true
      index_file: index
