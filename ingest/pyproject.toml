[project]
name = "kube-docs-ingest"
version = "0.1.0"
description = "Builds the kube-docs-mcp SQLite index from the registry"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "typer>=0.15",
  "httpx>=0.28",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "docutils>=0.21",
  "zstandard>=0.23",
  "rich>=13.9",
]

[project.scripts]
ingest = "ingest.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-docutils",
  "types-jsonschema",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W", "C4", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]  # asserts in tests; subprocess w/o shell is intended (git)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"ingest/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docutils.*", "markdown_it.*", "mdit_py_plugins.*", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ingest --cov-report=term-missing"

[tool.coverage.run]
omit = ["ingest/cli.py"]
