[package]
name = "kube-docs-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP server: Kubernetes + CNCF schemas, annotations and reference docs"
repository = "https://github.com/nizmitz/kube-docs-mcp"
rust-version = "1.85"

[lib]
name = "kube_docs_mcp"
path = "src/lib.rs"

[[bin]]
name = "kube-docs-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "fs", "time", "sync"] }
tokio-util = "0.7"
tower = { version = "=0.5.3", features = ["timeout", "limit"] }
tower-http = { version = "=0.7.1", features = ["trace", "limit", "timeout"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
jsonschema = { version = "=0.56.0", default-features = false }
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
rust-embed = { version = "=8.12.0", features = ["include-exclude"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
zstd = "=0.14.0"
sha2 = "=0.11.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt"] }
lru = "=0.18.4"
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "=1.9.2"
anyhow = "1"
thiserror = "2"
mime_guess = "2"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
