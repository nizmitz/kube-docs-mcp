[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "Zlib", "OpenSSL", "CDLA-Permissive-2.0", "Unicode-DFS-2016", "0BSD", "BSL-1.0", "MIT-0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
