extends: default
rules:
  line-length: { max: 160, level: warning }
  document-start: disable
  truthy: { check-keys: false }
  comments: { min-spaces-from-content: 1 }
  braces: { max-spaces-inside: 1 }
  brackets: { max-spaces-inside: 1 }
ignore: |
  build/
  work/
  ingest/tests/fixtures/
  ingest/.venv/
  web/node_modules/
  server/target/
